<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="moeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="240" rx="12" fill="#030712" />
  <rect x="1" y="1" width="598" height="238" rx="11" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Input Token Layer -->
  <g transform="translate(30, 95)">
    <rect width="90" height="50" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5" />
    <text x="45" y="25" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">INPUT</text>
    <text x="45" y="39" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Tokens x</text>
  </g>

  <!-- Router Gating Network -->
  <g transform="translate(160, 75)">
    <rect width="115" height="90" rx="10" fill="#111827" stroke="url(#glowG)" stroke-width="2" />
    <text x="57" y="26" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ROUTER</text>
    <text x="57" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Softmax Gating</text>
    <rect x="18" y="55" width="80" height="22" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="1" />
    <text x="58" y="70" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Top-k Sparse</text>
  </g>

  <!-- Connections: Input to Router -->
  <line x1="120" y1="120" x2="160" y2="120" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Connections: Router to Experts -->
  <path d="M 275 105 C 305 105, 305 50, 335 50" fill="none" stroke="#8B5CF6" stroke-width="2" />
  <path d="M 275 120 C 305 120, 305 120, 335 120" fill="none" stroke="#06B6D4" stroke-width="2" />
  <path d="M 275 135 C 305 135, 305 190, 335 190" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Specialized Experts -->
  <!-- Expert 1 (Active) -->
  <g transform="translate(335, 28)">
    <rect width="120" height="44" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.8" />
    <text x="60" y="20" fill="#C084FC" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Expert 1 (NLP)</text>
    <text x="60" y="34" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">w₁ = 0.68</text>
  </g>

  <!-- Expert 2 (Active) -->
  <g transform="translate(335, 98)">
    <rect width="120" height="44" rx="8" fill="#0C4A6E" stroke="#06B6D4" stroke-width="1.8" />
    <text x="60" y="20" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Expert 2 (Reasoning)</text>
    <text x="60" y="34" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">w₂ = 0.32</text>
  </g>

  <!-- Expert 3 (Inactive/Gated) -->
  <g transform="translate(335, 168)" opacity="0.45">
    <rect width="120" height="44" rx="8" fill="#111827" stroke="#475569" stroke-width="1" />
    <text x="60" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Expert 3 (Code)</text>
    <text x="60" y="34" fill="#64748B" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Gated Off (w₃ = 0)</text>
  </g>

  <!-- Connections: Experts to Aggregator -->
  <path d="M 455 50 C 475 50, 480 110, 495 110" fill="none" stroke="#8B5CF6" stroke-width="2" />
  <path d="M 455 120 C 475 120, 480 120, 495 120" fill="none" stroke="#06B6D4" stroke-width="2" />

  <!-- Output / Weighted Aggregator -->
  <g transform="translate(495, 88)">
    <rect width="80" height="64" rx="10" fill="url(#moeGrad)" opacity="0.95" />
    <text x="40" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Σ wᵢ Eᵢ(x)</text>
    <text x="40" y="46" fill="#E0E7FF" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">OUTPUT</text>
  </g>
</svg>
