<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="recGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="240" rx="12" fill="#030712" />
  <rect x="1" y="1" width="598" height="238" rx="11" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Content Stream 1: Metadata and TF-IDF -->
  <g transform="translate(30, 35)">
    <rect width="130" height="70" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5" />
    <text x="65" y="24" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">METADATA</text>
    <text x="65" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Genres, Cast, Plot</text>
    <rect x="15" y="48" width="100" height="14" rx="3" fill="rgba(59, 130, 246, 0.15)" />
    <text x="65" y="58" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">TF-IDF Vectorization</text>
  </g>

  <!-- Content Stream 2: User-Item Ratings -->
  <g transform="translate(30, 135)">
    <rect width="130" height="70" rx="8" fill="#111827" stroke="#06B6D4" stroke-width="1.5" />
    <text x="65" y="24" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">USER INTERACTIONS</text>
    <text x="65" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ratings &amp; Watch History</text>
    <rect x="15" y="48" width="100" height="14" rx="3" fill="rgba(6, 182, 212, 0.15)" />
    <text x="65" y="58" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Collaborative Signals</text>
  </g>

  <!-- Paths to Similarity Engine -->
  <path d="M 160 70 C 190 70, 190 105, 215 105" fill="none" stroke="#3B82F6" stroke-width="2" />
  <path d="M 160 170 C 190 170, 190 135, 215 135" fill="none" stroke="#06B6D4" stroke-width="2" />

  <!-- Similarity and Fusion Engine -->
  <g transform="translate(220, 60)">
    <rect width="160" height="120" rx="10" fill="#111827" stroke="url(#recGrad)" stroke-width="2" />
    <text x="80" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SIMILARITY ENGINE</text>
    <text x="80" y="44" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Pairwise Cosine Matrix</text>
    <line x1="20" y1="55" x2="140" y2="55" stroke="#1E293B" stroke-width="1" />
    
    <g transform="translate(25, 65)">
      <text x="0" y="12" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">cos(θ) = A · B / (||A|| ||B||)</text>
      <rect x="0" y="22" width="110" height="18" rx="3" fill="rgba(59, 130, 246, 0.15)" />
      <text x="55" y="34" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Hybrid Score Fusion</text>
    </g>
  </g>

  <!-- Flow to Ranked Results -->
  <path d="M 380 120 L 420 120" stroke="#06B6D4" stroke-width="2" />

  <!-- Ranked Feed -->
  <g transform="translate(425, 45)">
    <rect width="145" height="150" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="72" y="22" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">RANKED FEED</text>
    <line x1="15" y1="32" x2="130" y2="32" stroke="#1E293B" stroke-width="1" />

    <g transform="translate(12, 42)">
      <rect width="121" height="26" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
      <text x="10" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="600">1. Interstellar</text>
      <text x="110" y="17" fill="#10B981" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="end">98%</text>
    </g>

    <g transform="translate(12, 74)">
      <rect width="121" height="26" rx="4" fill="#1E293B" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="10" y="17" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">2. Inception</text>
      <text x="110" y="17" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="end">94%</text>
    </g>

    <g transform="translate(12, 106)">
      <rect width="121" height="26" rx="4" fill="#1E293B" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="10" y="17" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9">3. Blade Runner</text>
      <text x="110" y="17" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="end">89%</text>
    </g>
  </g>
</svg>
