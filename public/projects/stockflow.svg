<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="stockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="240" rx="12" fill="#030712" />
  <rect x="1" y="1" width="598" height="238" rx="11" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Frontend Client -->
  <g transform="translate(25, 45)">
    <rect width="115" height="150" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5" />
    <text x="57" y="24" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">CLIENT UI</text>
    <line x1="12" y1="34" x2="103" y2="34" stroke="#1E293B" stroke-width="1" />
    <text x="57" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">React 18</text>
    <text x="57" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Single-Page App</text>
    <rect x="14" y="90" width="87" height="18" rx="3" fill="#1E293B" />
    <text x="57" y="103" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Live Stock Audit</text>
    <rect x="14" y="116" width="87" height="18" rx="3" fill="#1E293B" />
    <text x="57" y="129" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Order Lifecycles</text>
  </g>

  <!-- Flow Arrow -->
  <path d="M 145 120 L 175 120" stroke="#3B82F6" stroke-width="2" />

  <!-- FastAPI Backend and PostgreSQL -->
  <g transform="translate(180, 35)">
    <rect width="195" height="170" rx="10" fill="#111827" stroke="url(#stockGrad)" stroke-width="2" />
    <text x="97" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">FASTAPI BACKEND</text>
    <text x="97" y="40" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Async REST Architecture</text>
    <line x1="18" y1="50" x2="177" y2="50" stroke="#1E293B" stroke-width="1" />

    <g transform="translate(18, 62)">
      <rect width="159" height="26" rx="4" fill="#1E293B" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
      <text x="10" y="17" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">JWT &amp; RBAC Auth</text>
    </g>

    <g transform="translate(18, 96)">
      <rect width="159" height="26" rx="4" fill="#1E293B" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <text x="10" y="17" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">PostgreSQL Relational DB</text>
    </g>

    <g transform="translate(18, 130)">
      <rect width="159" height="26" rx="4" fill="#1E293B" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <text x="10" y="17" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">Order State Machine</text>
    </g>
  </g>

  <!-- Flow Arrow -->
  <path d="M 380 120 L 415 120" stroke="#10B981" stroke-width="2" />

  <!-- DevOps: Docker, Prometheus, Grafana -->
  <g transform="translate(420, 45)">
    <rect width="155" height="150" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.8" />
    <text x="77" y="24" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">DEVOPS &amp; METRICS</text>
    <line x1="12" y1="34" x2="143" y2="34" stroke="#1E293B" stroke-width="1" />

    <g transform="translate(12, 46)">
      <rect width="131" height="24" rx="4" fill="#1E293B" />
      <text x="10" y="16" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">🐳 Docker &amp; Compose</text>
    </g>

    <g transform="translate(12, 78)">
      <rect width="131" height="24" rx="4" fill="#1E293B" />
      <text x="10" y="16" fill="#F97316" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">📊 Prometheus Metrics</text>
    </g>

    <g transform="translate(12, 110)">
      <rect width="131" height="24" rx="4" fill="#1E293B" />
      <text x="10" y="16" fill="#FACC15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">📈 Grafana Dashboards</text>
    </g>
  </g>
</svg>

