<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base -->
  <rect width="100" height="100" rx="24" fill="#030712" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#aiGrad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Neural Synapse Geometric Nodes -->
  <circle cx="50" cy="24" r="6" fill="#06B6D4" />
  <circle cx="26" cy="50" r="6" fill="#3B82F6" />
  <circle cx="74" cy="50" r="6" fill="#8B5CF6" />
  <circle cx="50" cy="76" r="6" fill="#06B6D4" />
  <circle cx="50" cy="50" r="10" fill="url(#aiGrad)" filter="url(#glow)" />

  <!-- Connecting Synapse Lines -->
  <line x1="50" y1="24" x2="50" y2="50" stroke="url(#aiGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="26" y1="50" x2="50" y2="50" stroke="url(#aiGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="74" y1="50" x2="50" y2="50" stroke="url(#aiGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="76" x2="50" y2="50" stroke="url(#aiGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Diagonal Sub-Synapses -->
  <line x1="50" y1="24" x2="26" y2="50" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="50" y1="24" x2="74" y2="50" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="26" y1="50" x2="50" y2="76" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="74" y1="50" x2="50" y2="76" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
</svg>
